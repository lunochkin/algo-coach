# One job, the same command a commit runs: lint, type-check, test, for the
# engine and the frontend.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # by commit, as its readme asks; the major tags stop at v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # pyright is a node program; on the path, it is not downloaded per run
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v4
      - run: uv lock --check
      - run: uv sync
      # the frontend's packages, which `just ci` type-checks and lints against
      - run: npm ci --prefix web
      - run: just ci
      # a dependency declared and unused, or used and undeclared
      - run: uv run --with deptry deptry src
