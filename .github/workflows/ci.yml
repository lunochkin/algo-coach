# One job, the same command a commit runs: lint, type-check, test, for the
# engine and the frontend. The tests run against Postgres.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the integration tests' server, on the version the engine runs against.
    # Its default user is a superuser, which creates the workers' databases and
    # sets `session_replication_role`. A throwaway container, so the password is
    # no secret
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # by commit, as its readme asks; the major tags stop at v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # pyright is a node program; on the path, it is not downloaded per run
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v4
      - run: uv lock --check
      - run: uv sync
      # the frontend's packages, which `just ci` type-checks and lints against
      - run: npm ci --prefix web
      - run: just ci
      # a dependency declared and unused, or used and undeclared
      - run: uv run --with deptry deptry src

  # The image, then one command to the server. The server's key carries a
  # forced command, so the argument below is all this job decides: which image
  # to run. `docs/architecture/README.md` gives why the server pulls the
  # compose file out of that image rather than cloning this repo.
  deploy:
    needs: check
    # a pull request builds nothing: the push to main that merges it does
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # a second push waits for this deploy rather than cancelling it halfway
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          # the layers of the last build, so a run that changed no dependency
          # reinstalls none
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the address is a secret, as `README.md` requires. The key's own
      # `known_hosts` entry is checked, so a redirected host answers nothing
      - env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          # by digest rather than by tag: the server runs the image this job
          # pushed, whatever the tag points at by the time it pulls
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$USER@$HOST" "$IMAGE"
