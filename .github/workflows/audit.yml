# Known vulnerabilities in what is installed. Weekly, since a new advisory
# arrives without a commit.
name: audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run --with pip-audit pip-audit
