[project]
name = "algo-coach"
version = "0.1.0"
description = "AI coaching layer for deliberate practice of algorithmic problem-solving: SRS over a technique-mastery model, on a problem corpus the engine writes and owns"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Maksim Lunochkin" }]
dependencies = [
    "openai>=1.60",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
algo-coach = "algo_coach.cli:main"

[dependency-groups]
dev = [
    "duckdb>=1.5",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
python_classes = []
# The annotation prompt is a textual app, and its pilot is an async generator.
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_coach"]
