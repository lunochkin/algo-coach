[project]
name = "climb"
version = "0.1.0"
description = "AI coaching layer for deliberate practice of algorithmic problem-solving: SRS over a technique-mastery model, on a problem corpus the engine writes and owns"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15.2"
authors = [{ name = "Maksim Lunochkin" }]
dependencies = [
    "alembic>=1.19.2",
    "authlib>=1.8.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "joserfc>=1.7.5",
    "openai>=3.49.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
    "textual>=8.2.8",
    "uvicorn>=0.52.4",
]

[project.scripts]
climb = "climb.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "import-linter>=2.15",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16.0",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
python_classes = []
# The workers cost two seconds to start; `-n 0` for one file. `worksteal`, since
# the generation tests are slow and `load` leaves workers idle behind them
addopts = "-n auto --dist worksteal"
# a warning is a defect the interpreter noticed first: a leaked child, a
# deprecated call. The runner's stop-early path leaked one before this was on
filterwarnings = ["error"]
# The annotation prompt is a textual app, and its pilot is an async generator.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    # set by `tests/conftest.py` on every test taking the `database` fixture
    "integration: runs against the Postgres server TEST_DATABASE_URL names",
]

[tool.pyright]
include = ["src"]
# tests are unannotated by design: pydantic coerces what strict rejects
ignore = ["tests"]
pythonVersion = "3.15"
typeCheckingMode = "strict"

[tool.importlinter]
root_package = "climb"

[[tool.importlinter.contracts]]
name = "schema, ids, storage and standing import nothing of the domain"
type = "forbidden"
source_modules = ["climb.schema", "climb.ids", "climb.storage", "climb.standing"]
forbidden_modules = [
    "climb.calls",
    "climb.mint",
    "climb.techniques",
    "climb.log",
    "climb.attempt_claims",
    "climb.solution_claims",
    "climb.matches",
    "climb.generation",
    "climb.cli",
    "climb.api",
]

[[tool.importlinter.contracts]]
name = "the transport and the vocabulary sit under the domain"
type = "forbidden"
source_modules = ["climb.calls", "climb.techniques"]
forbidden_modules = [
    "climb.mint",
    "climb.log",
    "climb.attempt_claims",
    "climb.solution_claims",
    "climb.matches",
    "climb.generation",
    "climb.cli",
    "climb.api",
]

[[tool.importlinter.contracts]]
name = "no store reads another store"
type = "independence"
modules = [
    "climb.cases",
    "climb.solutions",
    "climb.outcomes",
    "climb.drafts",
    "climb.problems",
    "climb.verifications",
    "climb.cards",
    "climb.ratings",
    "climb.judgements",
]

[[tool.importlinter.contracts]]
name = "the packages are layered, and nothing imports upward"
type = "layers"
layers = [
    "climb.cli | climb.api",
    "climb.generation : climb.ladder : climb.recall : climb.judging",
    "climb.attempt_claims : climb.solution_claims : climb.matches : climb.board : climb.cards : climb.sitting",
    "climb.classifier : climb.mint : climb.log : climb.knowledge : climb.outcomes : climb.problems : climb.solutions : climb.cases : climb.drafts : climb.ratings : climb.judgements : climb.verifications : climb.techniques : climb.mutation : climb.calls : climb.runs",
    "climb.runner",
    "climb.schema : climb.ids : climb.storage : climb.standing",
]

[[tool.importlinter.contracts]]
name = "nothing imports an adapter"
type = "forbidden"
source_modules = [
    "climb.attempt_claims",
    "climb.solution_claims",
    "climb.matches",
    "climb.generation",
    "climb.board",
    "climb.sitting",
    "climb.runner",
    "climb.mutation",
]
forbidden_modules = ["climb.cli", "climb.api"]

# the process holding the container runtime's socket loads no engine code. The
# wildcard covers a package added later, and matches none of the broker's own
[[tool.importlinter.contracts]]
name = "the broker imports nothing of the engine"
type = "forbidden"
source_modules = ["climb.broker"]
forbidden_modules = ["climb.*"]

# used outside `src`, which is all deptry reads: Alembic runs `migrations/`, and
# SQLAlchemy loads psycopg from the database URL's scheme. Starlette's session
# middleware signs the sign-in state with itsdangerous, which it never declares
[tool.deptry.per_rule_ignores]
DEP002 = ["alembic", "itsdangerous", "psycopg"]

[tool.coverage.run]
source = ["climb"]

[tool.coverage.report]
# what a module landing untested drops the total by. The uncovered lines are the
# child's signal path and the CLI's exits
fail_under = 95
skip_covered = true
show_missing = true

# ---- mutation testing of the suite itself: `just mutate`, never the hook
[tool.mutmut]
paths_to_mutate = ["src/climb/"]
tests_dir = ["tests/"]

# ---- dead code: a name nothing in src or tests references
[tool.vulture]
paths = ["src", "tests"]
# a schema field or an enum member no code reads is still one a stored record
# carries, and a code is never deleted
exclude = ["src/climb/schema/"]
# pydantic calls validators and FastAPI calls routes by registration, pytest
# calls fixtures by name
ignore_decorators = [
    "@field_validator", "@model_validator", "@app.*", "@router.*", "@pytest.fixture",
]
ignore_names = [
    "model_config",
    # the judging page reads what an item is about, and no module does
    "card_title", "template_title", "example", "asks",
    # pytest reads the plugins a conftest names, and calls its hooks by name
    "pytest_plugins",
    "pytest_*",
    # textual reads the class attributes and dispatches hooks and actions by name
    "compose", "on_*", "action_*", "CSS", "BINDINGS", "theme", "can_focus",
    # ast.NodeTransformer dispatches by name
    "visit_*",
    # a result record names the pair that failed; the report reads only the reason
    "card_id",
    # a card's recall state says when a form was last reproduced, which the page
    # reads and no module does
    "last_at",
    # the trainer lists the card's templates, and the page decides which of them
    # it offers to switch to
    "recallable",
    # the cards list reads a card's required rungs solved, and no module does
    "required_solved",
]

[tool.ruff]
line-length = 100  # code

# prose: ruff checks comments and docstrings against it, and
# `tests/test_prose.py` checks the docs
[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint]
# ANN401: `Any` in a signature is a decision, made where the value really is any.
# N818 is left out: an exception here is named by what happened (`Expired`),
# not by its base class.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN401", "RUF100", "RUF022", "RUF012", "C901", "PLC0415", "PT011", "T20"]

# the adapters and the scripts print; the domain does not
[tool.ruff.lint.per-file-ignores]
"src/climb/cli/**" = ["T20"]
"src/climb/api/__main__.py" = ["T20"]
".claude/skills/**" = ["T20"]
"tests/**" = ["T20"]

# Twelve is where `search`, `score_backlog` and `claim` sit. Each is one flow,
# and splitting it for the counter would spread that flow across helpers.
[tool.ruff.lint.mccabe]
max-complexity = 12

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climb"]
