[project]
name = "algo-coach"
version = "0.1.0"
description = "AI coaching layer for deliberate practice of algorithmic problem-solving: SRS over a technique-mastery model, on a problem corpus the engine writes and owns"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Maksim Lunochkin" }]
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "openai>=1.60",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "textual>=8.2.8",
    "uvicorn>=0.52.4",
]

[project.scripts]
algo-coach = "algo_coach.cli:main"

[dependency-groups]
dev = [
    "duckdb>=1.5",
    "httpx>=0.28.1",
    "hypothesis>=6.167.1",
    "import-linter>=2.15",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16.0",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
python_classes = []
# The workers cost two seconds to start; `-n 0` for one file.
addopts = "-n auto"
# a warning is a defect the interpreter noticed first: a leaked child, a
# deprecated call. The runner's stop-early path leaked one before this was on
filterwarnings = ["error"]
# The annotation prompt is a textual app, and its pilot is an async generator.
asyncio_mode = "auto"

[tool.pyright]
include = ["src"]
# tests are unannotated by design: pydantic coerces what strict rejects
ignore = ["tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.importlinter]
root_package = "algo_coach"

[[tool.importlinter.contracts]]
name = "schema, ids, storage and standing import nothing of the domain"
type = "forbidden"
source_modules = ["algo_coach.schema", "algo_coach.ids", "algo_coach.storage", "algo_coach.standing"]
forbidden_modules = [
    "algo_coach.calls",
    "algo_coach.mint",
    "algo_coach.techniques",
    "algo_coach.log",
    "algo_coach.attempt_claims",
    "algo_coach.solution_claims",
    "algo_coach.matches",
    "algo_coach.generation",
    "algo_coach.cli",
    "algo_coach.api",
]

[[tool.importlinter.contracts]]
name = "the transport and the vocabulary sit under the domain"
type = "forbidden"
source_modules = ["algo_coach.calls", "algo_coach.techniques"]
forbidden_modules = [
    "algo_coach.mint",
    "algo_coach.log",
    "algo_coach.attempt_claims",
    "algo_coach.solution_claims",
    "algo_coach.matches",
    "algo_coach.generation",
    "algo_coach.cli",
    "algo_coach.api",
]

[[tool.importlinter.contracts]]
name = "no store reads another store"
type = "independence"
modules = [
    "algo_coach.cases",
    "algo_coach.solutions",
    "algo_coach.outcomes",
    "algo_coach.drafts",
    "algo_coach.problems",
    "algo_coach.verifications",
    "algo_coach.cards",
]

[[tool.importlinter.contracts]]
name = "the packages are layered, and nothing imports upward"
type = "layers"
layers = [
    "algo_coach.cli | algo_coach.api",
    "algo_coach.generation",
    "algo_coach.attempt_claims : algo_coach.solution_claims : algo_coach.matches : algo_coach.board : algo_coach.cards : algo_coach.sitting",
    "algo_coach.classifier : algo_coach.mint : algo_coach.log : algo_coach.outcomes : algo_coach.problems : algo_coach.solutions : algo_coach.cases : algo_coach.drafts : algo_coach.verifications : algo_coach.techniques : algo_coach.mutation : algo_coach.calls : algo_coach.runs",
    "algo_coach.runner",
    "algo_coach.schema : algo_coach.ids : algo_coach.storage : algo_coach.standing",
]

[[tool.importlinter.contracts]]
name = "nothing imports an adapter"
type = "forbidden"
source_modules = [
    "algo_coach.attempt_claims",
    "algo_coach.solution_claims",
    "algo_coach.matches",
    "algo_coach.generation",
    "algo_coach.board",
    "algo_coach.sitting",
    "algo_coach.runner",
    "algo_coach.mutation",
]
forbidden_modules = ["algo_coach.cli", "algo_coach.api"]

# used outside `src`, which is all deptry reads: Alembic runs `migrations/`, and
# SQLAlchemy loads psycopg from the database URL's scheme
[tool.deptry.per_rule_ignores]
DEP002 = ["alembic", "psycopg"]

[tool.coverage.run]
source = ["algo_coach"]

[tool.coverage.report]
# what a module landing untested drops the total by. The uncovered lines are the
# child's signal path and the CLI's exits
fail_under = 95
skip_covered = true
show_missing = true

# ---- mutation testing of the suite itself: `just mutate`, never the hook
[tool.mutmut]
paths_to_mutate = ["src/algo_coach/"]
tests_dir = ["tests/"]

# ---- dead code: a name nothing in src or tests references
[tool.vulture]
paths = ["src", "tests"]
# a schema field or an enum member no code reads is still one a stored record
# carries, and a code is never deleted
exclude = ["src/algo_coach/schema/"]
# pydantic calls validators and FastAPI calls routes by registration, pytest
# calls fixtures by name
ignore_decorators = [
    "@field_validator", "@model_validator", "@app.*", "@router.*", "@pytest.fixture",
]
ignore_names = [
    "model_config",
    # textual reads the class attributes and dispatches hooks and actions by name
    "compose", "on_*", "action_*", "CSS", "BINDINGS", "theme", "can_focus",
    # ast.NodeTransformer dispatches by name
    "visit_*",
    # a result record names the pair that failed; the report reads only the reason
    "card_id",
]

[tool.ruff]
line-length = 100  # code

# prose: ruff checks comments and docstrings against it, and
# `tests/test_prose.py` checks the docs
[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint]
# ANN401: `Any` in a signature is a decision, made where the value really is any.
# N818 is left out: an exception here is named by what happened (`Expired`),
# not by its base class.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN401", "RUF100", "RUF022", "RUF012", "C901", "PLC0415", "PT011", "T20"]

# the adapters and the scripts print; the domain does not
[tool.ruff.lint.per-file-ignores]
"src/algo_coach/cli/**" = ["T20"]
"src/algo_coach/api/__main__.py" = ["T20"]
"scripts/**" = ["T20"]
".claude/skills/**" = ["T20"]
"tests/**" = ["T20"]

# Twelve is where `search`, `score_backlog` and `claim` sit. Each is one flow,
# and splitting it for the counter would spread that flow across helpers.
[tool.ruff.lint.mccabe]
max-complexity = 12

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_coach"]
