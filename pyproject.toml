[project]
name = "algo-coach"
version = "0.1.0"
description = "AI coaching layer for deliberate practice of algorithmic problem-solving: SRS over a technique-mastery model, on a problem corpus the engine writes and owns"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Maksim Lunochkin" }]
dependencies = [
    "openai>=1.60",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
algo-coach = "algo_coach.cli:main"

[dependency-groups]
dev = [
    "duckdb>=1.5",
    "import-linter>=2.15",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
python_classes = []
# The workers cost two seconds to start; `-n 0` for one file.
addopts = "-n auto"
# The annotation prompt is a textual app, and its pilot is an async generator.
asyncio_mode = "auto"

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.importlinter]
root_package = "algo_coach"

[[tool.importlinter.contracts]]
name = "schema, ids, storage and standing import nothing of the domain"
type = "forbidden"
source_modules = ["algo_coach.schema", "algo_coach.ids", "algo_coach.storage", "algo_coach.standing"]
forbidden_modules = [
    "algo_coach.calls",
    "algo_coach.mint",
    "algo_coach.techniques",
    "algo_coach.log",
    "algo_coach.claims",
    "algo_coach.readings",
    "algo_coach.matches",
    "algo_coach.generation",
    "algo_coach.cli",
]

[[tool.importlinter.contracts]]
name = "the transport and the vocabulary sit under the domain"
type = "forbidden"
source_modules = ["algo_coach.calls", "algo_coach.techniques"]
forbidden_modules = [
    "algo_coach.mint",
    "algo_coach.log",
    "algo_coach.claims",
    "algo_coach.readings",
    "algo_coach.matches",
    "algo_coach.generation",
    "algo_coach.cli",
]

[[tool.importlinter.contracts]]
name = "no store reads another store"
type = "independence"
modules = [
    "algo_coach.cases",
    "algo_coach.solutions",
    "algo_coach.outcomes",
    "algo_coach.drafts",
    "algo_coach.problems",
    "algo_coach.verifications",
    "algo_coach.cards",
]

[[tool.importlinter.contracts]]
name = "nothing imports the adapter"
type = "forbidden"
source_modules = [
    "algo_coach.claims",
    "algo_coach.readings",
    "algo_coach.matches",
    "algo_coach.generation",
    "algo_coach.board",
    "algo_coach.runner",
    "algo_coach.mutation",
]
forbidden_modules = ["algo_coach.cli"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ANN401: `Any` in a signature is a decision, made where the value really is any
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN401"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_coach"]
